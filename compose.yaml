services:
  postgres:
    container_name: 'postgres'
    image: 'docker.io/library/postgres:18-trixie'
    ports:
      - '5432:5432'
    volumes:
      - 'myapp-pg:/var/lib/postgresql/18'
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'myapp'
  myapp:
    container_name: 'web'
    build:
      context: './'
      dockerfile: 'containerfile'
    image: 'myapp/web'
    environment:
      - 'PORT=$PORT'
      - 'DB_URL=$DB_URL'
      - 'GOMEMLIMIT=$GOMEMLIMIT'
    ports:
      - '$PORT:$PORT'
  prometheus:
    container_name: 'prometheus'
    image: 'docker.io/prom/prometheus:v3.14.0'
    command:
      - "--web.listen-address=:${PROMETHEUS_PORT}"
      - "--web.enable-remote-write-receiver"
      # keeping default
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - '$PROMETHEUS_PORT:$PROMETHEUS_PORT'
    volumes:
      # The :z suffix relabels the file for SELinux. Without it, rootless podman on an SELinux host (Fedora, RHEL)
      # denies the container read access, which surfaces as "permission denied" on the bind-mounted config.
      - './prometheus.yml:/etc/prometheus/prometheus.yml:z'
    environment:
      - 'GOMEMLIMIT=$GOMEMLIMIT'
    depends_on:
      - 'myapp'
  grafana:
    container_name: 'grafana'
    image: 'docker.io/grafana/grafana:13.2.3'
    ports:
      - '$GRAFANA_PORT:3000'
    volumes:
      # Same SELinux relabeling as the Prometheus config above.
      - './grafana/sources.yaml:/etc/grafana/provisioning/datasources/sources.yaml:z'
      - './grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:z'
      - './grafana/myapp.json:/etc/grafana/provisioning/dashboards/myapp.json:z'
      - './grafana/myapp-api.json:/etc/grafana/provisioning/dashboards/myapp-api.json:z'
    environment:
      - 'PROMETHEUS_PORT=$PROMETHEUS_PORT'
    depends_on:
      - 'prometheus'
  k6:
    profiles: [test]
    container_name: 'k6'
    image: 'docker.io/grafana/k6:2.3.0'
    volumes:
      - './k6-script.js:/k6-script.js:z'
    command: 
      - 'run'
      - '-o'
      - 'experimental-prometheus-rw'
      - '/k6-script.js'
    environment:
      - 'PORT=$PORT'
      - 'K6_PROMETHEUS_RW_SERVER_URL=$K6_PROMETHEUS_RW_SERVER_URL'
      - 'K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=$K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM'
    depends_on:
      - 'grafana'
volumes:
  myapp-pg:
