apiVersion: score.dev/v1b1
metadata:
  name: web
containers:
  web:
    # '.' = "built from this repo"; the actual image is supplied at generate time
    image: .
    variables:
      PORT: "8080"
      GOMEMLIMIT: 256MiB
      DB_URL: postgres://${resources.db.username}:${resources.db.password}@${resources.db.host}:${resources.db.port}/${resources.db.database}?sslmode=disable
    readinessProbe:
      httpGet:
        port: 8080
        path: /metrics
service:
  ports:
    http:
      port: 8080
      targetPort: 8080
resources:
  # The platform decides what a "postgres" is: a container, a StatefulSet, RDS, ...
  db:
    type: postgres
