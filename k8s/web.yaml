apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          # Must match the `image` var in mise.toml. The localhost/ prefix gives docker and podman the same name for a
          # local build, so the node's containerd sees one consistent reference after `kind load`.
          image: localhost/myapp/web:dev
          # The image only exists on the nodes because of `kind load`; never fall back to pulling from a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: PORT
            - name: GOMEMLIMIT
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: GOMEMLIMIT
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: myapp-secrets
                  key: DB_URL
          # The app's health endpoint isn't known here, so only check that it accepts connections.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The compose service was called "myapp" while its container was called "web", and either name resolved on the compose
# network. Keep both resolvable so prometheus.yml and k6-script.js work whichever one they use.
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
