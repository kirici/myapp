apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      enableServiceLinks: false
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.3
          ports:
            - name: http
              containerPort: 3000
          env:
            # Referenced by the datasource provisioning file, same as in compose.
            - name: PROMETHEUS_PORT
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: PROMETHEUS_PORT
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            # dashboards.yaml (the provider) and the dashboard JSON files share one directory, as in compose.
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
